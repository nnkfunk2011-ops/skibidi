<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Cảm Ơn 3D</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .book {
            position: relative;
            width: 400px;
            height: 500px;
            perspective: 1000px;
        }
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            backface-visibility: hidden;
            border-left: 5px solid #ddd;
        }
        /* Trang cuối: Chữ cảm ơn */
        .page-back {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }
        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #999;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="book" onclick="turnPage()">
        <!-- Trang mở đầu -->
        <div class="page" id="page1">
            <h1>Bài Thuyết Trình</h1>
            <p>Cảm ơn thầy cô và các bạn đã chú ý lắng nghe!</p>
            <div class="hint">(Nhấp để lật trang)</div>
        </div>
        <!-- Trang kết / Lời cảm ơn chi tiết -->
        <div class="page page-back">
            <h1>Thank You!</h1>
            <p>Q&A - Mọi thắc mắc xin vui lòng đóng góp ý kiến.</p>
        </div>
    </div>

    <script>
        let flipped = false;
        function turnPage() {
            const page1 = document.getElementById('page1');
            if (!flipped) {
                page1.style.transform = 'rotateY(-180deg)';
                flipped = true;
            } else {
                page1.style.transform = 'rotateY(0deg)';
                flipped = false;
            }
        }
    </script>
</body>
</html>
